 button {

<body>
    <div class="nt"></div>
    
    <form action="">
        <table border="2" cellpadding="5" cellspacing="5">
            <TR>
                <TD colspan="2" align="center"> <h3>Employee Registration Form</h3></TD>
            </TR>
            
               

           
            <tr>
                <td>Full Name</td>
                <td><input type="text" placeholder="Enter Full Name"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" placeholder="Enter Email"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password"></td>
            </tr>
            <tr>
                <td>Department</td>
                <td><select name="" id="" required>
                <option value="Frontend">Frontend</option>
                <option value="">Backend</option>
                
            </select></td>
            </tr>

            <tr>
                <td>Gender</td>
        <td> <input type="radio" id="male" name="gender" value="MALE" size="5" required />
        <label for="male"> Male</label>

         <input type="radio" id="female" name="gender" value="FEMALE" size="5" required />
        <label for="female">Female</label></td>
            </tr>
            <tr>
                <td>Skills</td>
              
              <td><input type="checkbox" value="HTMl" id="html"><label for="html">HTML</label>
                <input type="checkbox" value="CSS" id="css"><label for="css">CSS</label>
                <input type="checkbox" value="Javascript" id="javascript"><label for="javascript">Javascript</label></td>
            </tr>
            <tr>
                <td>Message</td>
                <td><textarea name="Message" rows="4" cols="20" placeholder="Message" required></textarea></td>
            </tr>
            <tr>
                <td><input type="submit" placeholder="Submit Form"></td>
            </tr>
        </table>
